onboarding = false
# Herdr keybindings mirroring ~/.config/tmux/tmux.conf
# See tmux.conf for the source mapping. Reload after editing with:
#   herdr server reload-config
# or the reload_config binding below.

[keys]
# tmux: unbind C-b; bind C-Space send-prefix
prefix = "ctrl+space"

# tmux: bind [ previous-window / bind ] next-window
previous_tab = "prefix+["
next_tab = "prefix+]"
# default copy_mode is also prefix+[ (shadowed by previous_tab above);
# tmux: bind x copy-mode
copy_mode = "prefix+x"

# tmux: bind Up/Left/Down/Right select-pane -U/-L/-D/-R
focus_pane_up = "prefix+up"
focus_pane_down = "prefix+down"
focus_pane_left = "prefix+left"
focus_pane_right = "prefix+right"

# tmux: bind w kill-pane. w now belongs to workspace_picker instead (kept
# on prefix+w below), so close_pane moved to prefix+d; d is unbound by
# default (only prefix+shift+d, close_workspace, uses that letter).
close_pane = "prefix+d"
workspace_picker = "prefix+w"

# workspace nav: mirrors stock tmux's default prefix+( / prefix+) for
# previous-session/next-session (never overridden in tmux.conf, so still
# active there). switch_workspace uses shift since switch_tab already owns
# plain prefix+1..9.
previous_workspace = "prefix+("
next_workspace = "prefix+)"
switch_workspace = "prefix+shift+1..9"

reload_config = "prefix+shift+r"

# agent selection: unbound by default
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"
focus_agent = "prefix+alt+1..9"

# show what a Claude Code agent is actually doing (its dynamic terminal
# title), plus which pane, instead of just the default icon/name rows.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"], ["agent", "pane"]]
